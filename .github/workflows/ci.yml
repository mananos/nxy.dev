name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: hooks smoke test (no rtk installed → must pass commands through untouched)
        shell: bash
        env:
          NXY_HOME: ${{ runner.temp }}/nxy-home
        run: |
          echo '{"cwd":"'"$PWD"'","hook_event_name":"SessionStart"}' | node hosts/claude-code/hooks/sessionstart.mjs
          out=$(echo '{"tool_name":"Bash","cwd":"'"$PWD"'","tool_input":{"command":"git status"}}' | node hosts/claude-code/hooks/pretooluse-bash.mjs)
          test -z "$out" || { echo "expected no rewrite without rtk, got: $out"; exit 1; }
          echo '{"tool_name":"Bash","session_id":"ci","cwd":"'"$PWD"'","tool_input":{"command":"git status"},"tool_response":{"stdout":"ok","stderr":""}}' | node hosts/claude-code/hooks/posttooluse-bash.mjs
          test -s .nxy/local/metrics/filter.jsonl
          echo '{}' | node hosts/claude-code/statusline.mjs; echo
      - name: gate + locate smoke test
        shell: bash
        env:
          NXY_HOME: ${{ runner.temp }}/nxy-home-gate
        run: |
          # The gate must be silent below the threshold: no output at all means zero tokens.
          printf '%s\n' '{"type":"assistant","message":{"usage":{"input_tokens":500,"cache_read_input_tokens":19000}}}' > small.jsonl
          out=$(echo '{"tool_name":"Edit","cwd":"'"$PWD"'","transcript_path":"'"$PWD"'/small.jsonl","tool_input":{"file_path":"x.mjs"}}' | node hosts/claude-code/hooks/pretooluse-edit.mjs)
          test -z "$out" || { echo "expected no gate output under the threshold, got: $out"; exit 1; }
          # Above it, it must deny and name the implementer.
          printf '%s\n' '{"type":"assistant","message":{"usage":{"input_tokens":1200,"cache_read_input_tokens":151000}}}' > big.jsonl
          out=$(echo '{"tool_name":"Edit","cwd":"'"$PWD"'","transcript_path":"'"$PWD"'/big.jsonl","tool_input":{"file_path":"x.mjs"}}' | node hosts/claude-code/hooks/pretooluse-edit.mjs)
          echo "$out" | grep -q '"permissionDecision":"deny"' || { echo "expected deny above the threshold, got: $out"; exit 1; }
          echo "$out" | grep -q 'implementer' || { echo "deny reason must point at the implementer: $out"; exit 1; }
          # A subagent carrying the same context must never be blocked.
          mkdir -p sess/subagents && cp big.jsonl sess/subagents/agent-1.jsonl
          out=$(echo '{"tool_name":"Edit","cwd":"'"$PWD"'","transcript_path":"'"$PWD"'/sess/subagents/agent-1.jsonl","tool_input":{"file_path":"x.mjs"}}' | node hosts/claude-code/hooks/pretooluse-edit.mjs)
          test -z "$out" || { echo "the implementer must be able to write, got: $out"; exit 1; }
          rm -rf small.jsonl big.jsonl sess
          # The model-free search must work with no codegraph and (possibly) no rg installed.
          node hosts/claude-code/entries/locate.mjs --status
          node hosts/claude-code/entries/locate.mjs "where is the filter engine resolved" | head -20
          test -s .nxy/local/index/repomap.tsv
          node hosts/claude-code/entries/gate.mjs status

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NXY_HOME: ${{ runner.temp }}/nxy-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: build the binary into the versioned folder
        shell: bash
        run: |
          v=$(go run ./cmd/nxy version)
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          go build -o "$NXY_HOME/bin/$v/nxy$ext" ./cmd/nxy
      - name: hook startup time
        shell: bash
        run: |
          v=$(go run ./cmd/nxy version)
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          {
            echo "### Hook startup time ($RUNNER_OS)"
            echo
            "$NXY_HOME/bin/$v/nxy$ext" bench hook -n 20 -shim bin/nxy.cmd
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: shim smoke test (every hook event answers nothing)
        shell: bash
        run: |
          while IFS= read -r payload; do
            out=$(printf '%s' "$payload" | bash -c '. "$1/bin/nxy.cmd"; exit $LASTEXITCODE' _ "$PWD" 2>"$RUNNER_TEMP/shim-stderr") || { echo "non-zero exit for: $payload"; exit 1; }
            test -z "$out" || { echo "expected no output, got: $out (for: $payload)"; exit 1; }
            ! grep -q '^nxy:' "$RUNNER_TEMP/shim-stderr" || { echo "the shim reported a failure:"; cat "$RUNNER_TEMP/shim-stderr"; exit 1; }
          done <<'EOF'
          {"hook_event_name":"SessionStart","session_id":"ci","cwd":"."}
          {"hook_event_name":"PreToolUse","tool_name":"Bash","session_id":"ci","cwd":"."}
          {"hook_event_name":"PreToolUse","tool_name":"Edit","session_id":"ci","cwd":"."}
          {"hook_event_name":"PreToolUse","tool_name":"Grep","session_id":"ci","cwd":"."}
          {"hook_event_name":"PreToolUse","tool_name":"Agent","session_id":"ci","cwd":"."}
          {"hook_event_name":"PreToolUse","tool_name":"AskUserQuestion","session_id":"ci","cwd":"."}
          {"hook_event_name":"PostToolUse","tool_name":"Bash","session_id":"ci","cwd":"."}
          {"hook_event_name":"PostToolUse","tool_name":"Agent","session_id":"ci","cwd":"."}
          {"hook_event_name":"UserPromptSubmit","session_id":"ci","cwd":"."}
          {"hook_event_name":"SubagentStop","session_id":"ci","cwd":"."}
          {"hook_event_name":"Stop","session_id":"ci","cwd":"."}
          EOF
      - name: shim smoke test under Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $shim = Join-Path $PWD 'bin\nxy.cmd'
          $line = ". '$shim'; exit `$LASTEXITCODE"
          $payloads = @(
            '{"hook_event_name":"SessionStart","session_id":"ci","cwd":"."}',
            '{"hook_event_name":"PreToolUse","tool_name":"Bash","session_id":"ci","cwd":"."}',
            '{"hook_event_name":"PreToolUse","tool_name":"Edit","session_id":"ci","cwd":"."}',
            '{"hook_event_name":"PreToolUse","tool_name":"Grep","session_id":"ci","cwd":"."}',
            '{"hook_event_name":"PreToolUse","tool_name":"Agent","session_id":"ci","cwd":"."}',
            '{"hook_event_name":"PreToolUse","tool_name":"AskUserQuestion","session_id":"ci","cwd":"."}',
            '{"hook_event_name":"PostToolUse","tool_name":"Bash","session_id":"ci","cwd":"."}',
            '{"hook_event_name":"PostToolUse","tool_name":"Agent","session_id":"ci","cwd":"."}',
            '{"hook_event_name":"UserPromptSubmit","session_id":"ci","cwd":"."}',
            '{"hook_event_name":"SubagentStop","session_id":"ci","cwd":"."}',
            '{"hook_event_name":"Stop","session_id":"ci","cwd":"."}'
          )
          foreach ($p in $payloads) {
            $errFile = Join-Path $env:RUNNER_TEMP 'shim-stderr'
            $out = $p | powershell -NoProfile -NonInteractive -Command $line 2>$errFile
            if ($LASTEXITCODE -ne 0) { Write-Error "non-zero exit for: $p"; exit 1 }
            if ($out) { Write-Error "expected no output, got: $out (for: $p)"; exit 1 }
            if ((Test-Path $errFile) -and (Select-String -Path $errFile -Pattern '^nxy:' -Quiet)) { Write-Error "the shim reported a failure: $(Get-Content $errFile -Raw)"; exit 1 }
          }

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "v2.18.3"
          args: release --snapshot --clean
      - name: asset names must match what the shim downloads
        run: |
          for pat in 'nxy_.*_linux_amd64$' 'nxy_.*_linux_arm64$' 'nxy_.*_windows_amd64\.exe$' 'nxy_.*_darwin_arm64$'; do
            grep -Eq "$pat" dist/checksums.txt || { echo "dist/checksums.txt lacks an asset matching $pat"; cat dist/checksums.txt; exit 1; }
          done
