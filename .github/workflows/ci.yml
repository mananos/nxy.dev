name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: hooks smoke test (no rtk installed → must pass commands through untouched)
        shell: bash
        run: |
          echo '{"cwd":"'"$PWD"'","hook_event_name":"SessionStart"}' | node scripts/hooks/sessionstart.mjs
          out=$(echo '{"tool_name":"Bash","cwd":"'"$PWD"'","tool_input":{"command":"git status"}}' | node scripts/hooks/pretooluse-bash.mjs)
          test -z "$out" || { echo "expected no rewrite without rtk, got: $out"; exit 1; }
          echo '{"tool_name":"Bash","session_id":"ci","cwd":"'"$PWD"'","tool_input":{"command":"git status"},"tool_response":{"stdout":"ok","stderr":""}}' | node scripts/hooks/posttooluse-bash.mjs
          test -s .nxy/metrics/filter.jsonl
          echo '{}' | node scripts/metrics/statusline.mjs; echo
